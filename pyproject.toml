[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-pruner"
version = "0.1.0"
description = "Pruning and evaluation utilities for Persona-Pruner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.7.0",
  "openai>=1.70.0",
  "pandas>=2.0.0",
  "torch>=2.6.0",
  "tqdm>=4.67.0",
  "transformers>=4.52.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
rewrite = [
  "vllm>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["persona_pruner*"]
